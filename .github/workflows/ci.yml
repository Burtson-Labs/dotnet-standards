name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/BurtsonLabs.CodeAnalysis.Tests/BurtsonLabs.CodeAnalysis.Tests.csproj --configuration Release
      - run: dotnet pack src/BurtsonLabs.CodeAnalysis/BurtsonLabs.CodeAnalysis.csproj --configuration Release --output artifacts
